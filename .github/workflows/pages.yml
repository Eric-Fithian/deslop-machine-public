name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: pack
        run: |
          mkdir -p _site/v4/onnx
          cp index.html style.css app.js worker.js coi-serviceworker.js .nojekyll _site/
          cp v4/config.json v4/generation_config.json v4/tokenizer.json \
            v4/tokenizer_config.json v4/special_tokens_map.json _site/v4/
          cp v4/onnx/model_q4f16.onnx v4/onnx/model_q4f16.onnx_data _site/v4/onnx/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
