<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>deslop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>deslop</h1>
    <p>Rewrite AI prose so it reads like a paper. Runs in your browser.</p>
  </header>
  <main>
    <section>
      <label for="draft">Draft</label>
      <textarea id="draft" spellcheck="false" placeholder="Paste an AI paragraph."></textarea>
    </section>
    <section>
      <label>Revised</label>
      <div id="revised" aria-live="polite"></div>
    </section>
  </main>
  <footer>
    <button id="run" type="button" disabled>Rewrite</button>
    <button id="pause" type="button" class="secondary" disabled>Pause</button>
    <button id="clear" type="button" class="secondary" disabled>Clear</button>
    <label id="temp-wrap" for="temp">
      Temperature
      <output id="temp-val" for="temp">0</output>
      <input id="temp" type="range" min="0" max="1.5" step="0.1" value="0">
    </label>
    <p id="hint">⌘↩ or Ctrl↩</p>
    <p id="status">Loading the 0.6B model…</p>
  </footer>
  <script src="coi-serviceworker.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
